<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#244a43">
  <meta name="description" content="触って、試して、偶然できた。発見するたびに広がる、言葉のない小さな庭。">
  <title>ひらく、庭。</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23244a43'/%3E%3Cpath d='M32 49V25M32 36C9 39 10 15 12 15c18 0 23 11 20 21M32 28C29 9 51 8 51 9c0 14-8 20-19 19' fill='%23d4e8a3' stroke='%23d4e8a3' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="garden" aria-label="庭" tabindex="0"></canvas>
  <div class="hud">
    <div class="garden-tools">
      <button id="overview" class="glass flower-button" aria-label="庭を見渡す" aria-pressed="false"><svg id="petals" viewBox="0 0 64 64" aria-hidden="true"></svg></button>
      <button id="hint" class="glass hint-button" aria-label="ヒントをONにする" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c-3-3-1-8 2-10m10 0c3 2 5 7 2 10M5 19q7 3 14 0"/><path class="hint-spark" d="m12 3 1.4 3.6L17 8l-3.6 1.4L12 13l-1.4-3.6L7 8l3.6-1.4Z"/></svg></button>
    </div>
    <div class="tools">
      <button id="restart" class="glass restart-button" aria-label="最初からやり直す（長押し）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20v-9M12 14C5 15 3.5 10 4 6c5-.2 8 2.5 8 8M12 11c0-5 3-8 8-8 .5 5-2 8-8 8M8 20h8"/></svg>
        <svg class="restart-ring" viewBox="0 0 48 48" aria-hidden="true"><circle id="restart-progress" cx="24" cy="24" r="21" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
      </button>
      <button id="sound" class="glass" aria-label="音" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><g id="sound-wave"><path d="M16 8c2 2 2 6 0 8M19 5c4 4 4 10 0 14"/></g><path id="sound-off" d="m16 9 6 6m0-6-6 6"/></svg>
      </button>
      <button id="fullscreen" class="glass" aria-label="全画面" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m8 0h4v-4"/></svg></button>
    </div>
  </div>
  <div id="joystick" aria-hidden="true"><div id="stick"></div></div>
  <button id="touch" class="glass action" aria-label="触れる">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M17 27V13a3 3 0 0 1 6 0v12-17a3 3 0 0 1 6 0v17-13a3 3 0 0 1 6 0v14-8a3 3 0 0 1 6 0v13c0 9-6 15-15 15-4 0-7-2-10-5L8 31a3.5 3.5 0 0 1 5-5l4 3"/><g class="held-icon"><ellipse cx="24" cy="26" rx="8" ry="9" fill="#d9b27c"/><path d="M16 23q8-8 16 0q-8 5-16 0M24 18l2-4" fill="#a49660"/></g></svg>
  </button>
  <div class="vignette" aria-hidden="true"></div>
  <div id="renewal" aria-hidden="true"></div>
  <section id="ending" role="dialog" aria-modal="true" aria-label="庭のエンディング" hidden>
    <button id="ending-return" class="glass flower-button" aria-label="庭に戻る">
      <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="none">
        <ellipse cx="32" cy="15" rx="6" ry="10" fill="#e8b58b"/>
        <ellipse cx="44" cy="20" rx="6" ry="10" transform="rotate(45 44 20)" fill="#e8c77d"/>
        <ellipse cx="49" cy="32" rx="10" ry="6" fill="#c8ce83"/>
        <ellipse cx="44" cy="44" rx="6" ry="10" transform="rotate(135 44 44)" fill="#9abd86"/>
        <ellipse cx="32" cy="49" rx="6" ry="10" fill="#83b9a0"/>
        <ellipse cx="20" cy="44" rx="6" ry="10" transform="rotate(45 20 44)" fill="#89bac2"/>
        <ellipse cx="15" cy="32" rx="10" ry="6" fill="#b0b6ce"/>
        <ellipse cx="20" cy="20" rx="6" ry="10" transform="rotate(135 20 20)" fill="#d1b3bd"/>
        <circle cx="32" cy="32" r="6" fill="#f6dda1"/>
      </g></svg>
    </button>
  </section>
  <script type="module" src="garden.js"></script>
</body>
</html>
